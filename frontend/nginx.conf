server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host:30443$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/kubelab/tls/tls.crt;
    ssl_certificate_key /run/kubelab/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;

    proxy_ssl_server_name on;
    proxy_ssl_name kubelab-backend.kubelab.svc.cluster.local;
    proxy_ssl_trusted_certificate /run/kubelab/ca/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 1;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/actions/ {
        proxy_pass https://kubelab-backend:8443;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass https://kubelab-backend:8443;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
