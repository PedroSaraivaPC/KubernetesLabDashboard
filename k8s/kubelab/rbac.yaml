apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelab-backend
  namespace: kubelab
  labels:
    app.kubernetes.io/part-of: kubelab
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelab-frontend
  namespace: kubelab
  labels:
    app.kubernetes.io/part-of: kubelab
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubelab-dashboard-reader
  labels:
    app.kubernetes.io/part-of: kubelab
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]

  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubelab-dashboard-reader
  labels:
    app.kubernetes.io/part-of: kubelab
subjects:
  - kind: ServiceAccount
    name: kubelab-backend
    namespace: kubelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubelab-dashboard-reader
