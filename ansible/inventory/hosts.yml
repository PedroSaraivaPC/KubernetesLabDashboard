---
# Kubernetes VM inventory.
all:
  children:
    k8s_cluster:
      # Shared connection settings for the three VMs.
      vars:
        ansible_user: pedro
        ansible_ssh_private_key_file: "~/.ssh/id_ed25519_kubelab"
        ansible_python_interpreter: /usr/bin/python3

      children:
        control_plane:
          hosts:
            k8s-control-plane:
              ansible_host: 192.168.219.10

        workers:
          hosts:
            k8s-worker-01:
              ansible_host: 192.168.219.11
            k8s-worker-02:
              ansible_host: 192.168.219.12
