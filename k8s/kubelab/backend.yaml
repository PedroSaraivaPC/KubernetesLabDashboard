apiVersion: v1
kind: Service
metadata:
  name: kubelab-backend
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab-backend
    app.kubernetes.io/part-of: kubelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubelab-backend
  ports:
    - name: https
      protocol: TCP
      port: 8443
      targetPort: https

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab-backend
  namespace: kubelab
  labels:
    app.kubernetes.io/name: kubelab-backend
    app.kubernetes.io/part-of: kubelab
spec:
  replicas: 3
  minReadySeconds: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: kubelab-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubelab-backend
        app.kubernetes.io/part-of: kubelab

    spec:
      serviceAccountName: kubelab-backend
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30

      nodeSelector:
        kubelab.io/workloads: enabled

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kubelab-backend

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: localhost/kubelab-backend:1.0.0
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn"]
          args:
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8443"
            - --ssl-keyfile
            - /run/kubelab/tls/tls.key
            - --ssl-certfile
            - /run/kubelab/tls/tls.crt

          ports:
            - name: https
              containerPort: 8443
              protocol: TCP

          env:
            - name: KUBELAB_KUBE_MODE
              value: "incluster"
            - name: KUBELAB_SERVE_FRONTEND
              value: "0"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: backend-tls
              mountPath: /run/kubelab/tls
              readOnly: true
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: "64Mi"
        - name: backend-tls
          secret:
            secretName: kubelab-backend-tls
            defaultMode: 0440
